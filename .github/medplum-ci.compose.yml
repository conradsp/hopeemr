# Throwaway Medplum stack for CI integration tests (access policy enforcement).
# Same server version as production (docker-compose-emr-https.yml). Not for any real data.
services:
  postgres:
    image: postgres:16.15
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
    command: ['postgres', '-c', 'default_transaction_isolation=REPEATABLE READ']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    command: redis-server --requirepass medplum
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'medplum', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  medplum-server:
    image: medplum/medplum-server:5.2.15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8103:8103'
    command: ['env']
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: 'http://localhost:8103/'
      MEDPLUM_APP_BASE_URL: 'http://localhost:3000/'
      MEDPLUM_STORAGE_BASE_URL: 'http://localhost:8103/storage/'
      MEDPLUM_DATABASE_HOST: 'postgres'
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: 'medplum'
      MEDPLUM_DATABASE_USERNAME: 'medplum'
      MEDPLUM_DATABASE_PASSWORD: 'medplum'
      MEDPLUM_REDIS_HOST: 'redis'
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: 'medplum'
      MEDPLUM_BINARY_STORAGE: 'file:./binary/'
      MEDPLUM_SUPPORT_EMAIL: '"HopeEMR CI" <ci@example.com>'
      MEDPLUM_RECAPTCHA_SITE_KEY: ''
      MEDPLUM_RECAPTCHA_SECRET_KEY: ''
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: 'false'
      MEDPLUM_ALLOWED_ORIGINS: '*'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:8103/healthcheck").then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))']
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
