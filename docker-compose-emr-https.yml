# HopeEMR Production Docker Compose with HTTPS
# Optimized for 2GB RAM Lightsail instance
#
# Prerequisites:
# 1. Run scripts/setup-server.sh on the host first (swap + log rotation)
# 2. Set up SSL certificates with certbot
#
# Usage: docker compose -f docker-compose-emr-https.yml up -d

services:
  postgres:
    image: postgres:16.15
    restart: always
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - 'postgres'
      - '-c'
      - 'listen_addresses=*'
      - '-c'
      - 'max_connections=100'
      - '-c'
      - 'shared_buffers=128MB'
      - '-c'
      - 'effective_cache_size=256MB'
      - '-c'
      - 'maintenance_work_mem=32MB'
      - '-c'
      - 'work_mem=4MB'
      - '-c'
      - 'statement_timeout=60000'
      - '-c'
      - 'default_transaction_isolation=REPEATABLE READ'
      # Reduced logging - only log errors and slow queries
      - '-c'
      - 'log_statement=none'
      - '-c'
      - 'log_min_duration_statement=1000'
      - '-c'
      - 'log_checkpoints=on'
    # No published ports: only reachable on the internal Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - medplum-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.12-alpine
    restart: always
    # noeviction: Medplum keeps job queues in Redis; evicting keys silently drops jobs
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --maxmemory 100mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - medplum-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  medplum-server:
    image: medplum/medplum-server:5.2.15
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '8103'
    volumes:
      - medplum_storage:/usr/src/medplum/packages/server/binary
    # The v5 image is hardened (no shell): keep its ENTRYPOINT and pass only the config source
    command: ['env']
    environment:
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=512'
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: '${MEDPLUM_SERVER_URL:-https://api.hopeemr.com}/'
      MEDPLUM_APP_BASE_URL: '${MEDPLUM_APP_URL:-https://hopeemr.com}/'
      MEDPLUM_STORAGE_BASE_URL: '${MEDPLUM_SERVER_URL:-https://api.hopeemr.com}/storage/'

      MEDPLUM_DATABASE_HOST: 'postgres'
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: 'medplum'
      MEDPLUM_DATABASE_USERNAME: 'medplum'
      MEDPLUM_DATABASE_PASSWORD: '${POSTGRES_PASSWORD}'

      MEDPLUM_REDIS_HOST: 'redis'
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: '${REDIS_PASSWORD}'

      MEDPLUM_BINARY_STORAGE: 'file:./binary/'
      MEDPLUM_SUPPORT_EMAIL: '${SUPPORT_EMAIL:-"HopeEMR" <support@hopeemr.com>}'
      MEDPLUM_GOOGLE_CLIENT_ID: '397236612778-c0b5tnjv98frbo1tfuuha5vkme3cmq4s.apps.googleusercontent.com'
      MEDPLUM_GOOGLE_CLIENT_SECRET: ''
      MEDPLUM_RECAPTCHA_SITE_KEY: ''
      MEDPLUM_RECAPTCHA_SECRET_KEY: ''
      MEDPLUM_MAX_JSON_SIZE: '1mb'
      MEDPLUM_MAX_BATCH_SIZE: '50mb'
      MEDPLUM_BOT_LAMBDA_ROLE_ARN: ''
      MEDPLUM_BOT_LAMBDA_LAYER_NAME: 'medplum-bot-layer'
      # Bots run inside the server process; HopeEMR uses none, so keep them off
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: 'false'
      MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: 'vmcontext'
      MEDPLUM_ALLOWED_ORIGINS: '${MEDPLUM_APP_URL:-https://hopeemr.com}'
      MEDPLUM_INTROSPECTION_ENABLED: 'false'
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: 30000
      MEDPLUM_LOG_LEVEL: 'warn'

      # SMTP Configuration (set these in .env file)
      MEDPLUM_SMTP_HOST: '${SMTP_HOST:-email-smtp.us-east-1.amazonaws.com}'
      MEDPLUM_SMTP_PORT: '${SMTP_PORT:-587}'
      MEDPLUM_SMTP_USERNAME: '${SMTP_USERNAME}'
      MEDPLUM_SMTP_PASSWORD: '${SMTP_PASSWORD}'

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - medplum-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # EMR Application - Production build served by nginx
  emr-app:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        VITE_MEDPLUM_BASE_URL: ${MEDPLUM_BASE_URL:-https://api.hopeemr.com}
        VITE_GOOGLE_CLIENT_ID: 397236612778-c0b5tnjv98frbo1tfuuha5vkme3cmq4s.apps.googleusercontent.com
        # The app's ClientApplication id in the HopeEMR project; it changes whenever the DB is reset
        VITE_MEDPLUM_CLIENT_ID: ${MEDPLUM_CLIENT_ID:?Set MEDPLUM_CLIENT_ID in .env}
    restart: always
    depends_on:
      medplum-server:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medplum-network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Nginx reverse proxy with SSL
  nginx-proxy:
    image: nginx:1.30.6-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - medplum-server
      - emr-app
    networks:
      - medplum-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"

volumes:
  postgres_data:
  redis_data:
  medplum_storage:

networks:
  medplum-network:
    driver: bridge
